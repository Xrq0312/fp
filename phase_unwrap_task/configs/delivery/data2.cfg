raw_dir = data_phase_unwrap/data2/RAW
out_dir = phase_unwrap_task/results_delivery
prefix = data2_raw

decode_raw_phase = true
raw_phase_start = 1

# Fit the visualization trend only with stable samples away from +/-pi.
trend_fit_phase_threshold = 0.6

modulation_abs_floor = 4.0
# Integrate across the image; reject only pixels that fail the RAW-derived
# amplitude/coherence/model-residual/residue-density confidence test.
use_modulation_mask = false
modulation_min_weak_ratio_for_otsu = 0.2
modulation_otsu_cap_pct = 25.0
modulation_erode_size = 0
